services:
  luanti:
    image: lscr.io/linuxserver/luanti:latest
    container_name: luanti-mineclonia
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - CLI_ARGS=--gameid mineclonia --worldname world
    volumes:
      - ./data/.minetest:/config/.minetest
    ports:
      - 30000:30000/udp
    restart: unless-stopped

